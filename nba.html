<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBA Command Hub</title>
<style>
:root{--bg:#0a0a0c;--p:#141318;--p2:#1a1920;--ln:#2b2931;--tx:#edeef2;--mu:#8e8a96;--acc:#ff6b00;--acc2:#c94e00;--blu:#4a90e2;--grn:#2ecc71;--gold:#c8a24a;--red:#d20a0a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3{font-family:Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.04em;font-weight:400;margin:0}
header{position:sticky;top:0;z-index:20;background:#0c0c0fee;backdrop-filter:blur(8px);border-bottom:2px solid var(--acc2)}
.hd{max-width:1320px;margin:auto;display:flex;align-items:center;gap:18px;padding:10px 16px;flex-wrap:wrap}
.logo{font:26px Impact,sans-serif;letter-spacing:.06em}.logo b{color:var(--acc)}
nav{display:flex;gap:2px;flex-wrap:wrap}nav button{background:none;border:0;color:var(--mu);padding:8px 12px;font:600 13px inherit;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;border-bottom:2px solid transparent}
nav button.on,nav button:hover{color:#fff;border-color:var(--acc)}
.chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--p2);border:1px solid var(--ln);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--mu)}.chip b{color:var(--tx)}
main{max-width:1320px;margin:auto;padding:18px 16px 60px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.g4{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.card{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:14px}
.card h3{font-size:17px;margin-bottom:10px;border-left:4px solid var(--acc2);padding-left:8px}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}.sec h2{font-size:24px}.sec small{color:var(--mu)}
button.b,select,input{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:7px 10px;font:inherit}
button.b{cursor:pointer;font-weight:600}button.b:hover{border-color:var(--acc)}button.r{background:var(--acc2);border-color:var(--acc2);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.mu{color:var(--mu)}.sm{font-size:12px}.pill{display:inline-block;background:var(--p2);border:1px solid var(--ln);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--mu);margin-right:4px}
.ok{color:var(--grn)}.bad{color:#ff5a5a}.warn{color:var(--gold)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.loading{color:var(--mu);padding:20px;text-align:center}
.livepill{display:inline-block;background:#7a1f1f;border:1px solid var(--red);color:#ff8080;border-radius:4px;padding:1px 7px;font:700 11px Impact,"Arial Narrow",sans-serif;letter-spacing:.05em;animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{50%{opacity:.35}}
.av{width:34px;height:34px;border-radius:50%;object-fit:contain;background:#1e1c24;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--mu);font-size:11px;overflow:hidden}
.lg{width:34px;height:34px;border-radius:50%;object-fit:contain;background:#1e1c24;flex:none}
.gcard{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:12px;display:flex;flex-direction:column;transition:border-color .15s}.gcard:hover{border-color:var(--acc)}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}.gtop .ev{color:var(--mu);font-size:11.5px}
.grow{display:flex;align-items:center;gap:10px;padding:3px 0}
.grow .nm{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .sc{font:700 22px Impact,'Arial Narrow',sans-serif;min-width:22px;text-align:center}
.grow .rec{color:var(--mu);font-size:11px;white-space:nowrap}
.grow.win .nm{color:#fff}.grow.win .sc{color:var(--acc)}
.gfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px;padding-top:8px;border-top:1px solid var(--ln);color:var(--mu);font-size:11.5px}
.gactions{display:flex;gap:6px;margin-top:9px}.gbtn{flex:1;padding:7px 4px;background:rgba(255,107,0,.16);border:1px solid rgba(255,107,0,.5);border-radius:6px;color:#ffa85c;font-size:11px;font-weight:700;letter-spacing:.02em;cursor:pointer;transition:background .15s,border-color .15s,color .15s}.gbtn:hover{background:rgba(255,107,0,.28);border-color:var(--acc);color:#ffc08a}.gbtn.tp5{background:rgba(74,144,226,.16);border:1px solid rgba(74,144,226,.5);color:#8fbcf2}.gbtn.tp5:hover{background:rgba(74,144,226,.28);border-color:var(--blu);color:#b5d4fa}
.gdetail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--ln)}
.gdetail.open{display:block}
.gdetail-head{font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;color:var(--tx)}
.gdetail-inner{display:flex;flex-direction:column;gap:2px}
.hs{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:top;background:#1e1c24;flex:none;border:2px solid var(--ln);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--mu);font-size:11px;overflow:hidden}
.tp5-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tp5-team{min-width:0}
.tp5-h{font-weight:700;font-size:11px;margin-bottom:6px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:4px;border-bottom:1px solid var(--ln)}
.tp5-row{display:flex;align-items:center;gap:9px;padding:4px 0}
.tp5-info{flex:1;min-width:0}
.tp5-nm{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp5-sub{color:var(--mu);font-size:10px}
.tp5-sc{font-weight:400;font-size:14px;color:var(--acc);font-variant-numeric:tabular-nums}
/* results archive */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:6px}
.form-card{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:10px;text-align:center}
.form-nm{font-family:Impact,'Arial Narrow',sans-serif;font-size:15px;letter-spacing:.03em}
.form-wl{font-size:16px;font-weight:700;margin:2px 0}
.form-pct{font-size:12px;color:var(--mu)}
.form-pct.good{color:var(--grn)}.form-pct.bad{color:var(--red)}
.win{font-weight:700;color:var(--grn)}
.tp5-head{text-align:center;font-family:Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:14px;font-weight:400;margin-bottom:10px;color:var(--tx)}
.tp5-team.mir .tp5-h{text-align:right}
.tp5-row.mir{flex-direction:row-reverse}
.tp5-team.mir .tp5-nm{text-align:right}
@media(max-width:520px){.tp5-grid{grid-template-columns:1fr}}
.stbl{overflow-x:auto}.stbl table{min-width:520px}
.tlogo{width:22px;height:22px;border-radius:50%;object-fit:contain;vertical-align:middle;background:#1e1c24;margin-right:7px}
.tname{display:flex;align-items:center}
.news{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}.news img{width:120px;height:76px;object-fit:cover;border-radius:6px;flex:none;background:#1e1c24}
.news .tt{font-weight:700;font-size:14px;color:var(--tx);line-height:1.3}.news .ds{color:var(--mu);font-size:11px;margin-top:3px}
.obk{color:var(--mu);font-size:11px}
.odds-grid{display:grid;gap:10px}
.odds-card{background:var(--p);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.oc-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--p2);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.oc-head b{font-size:14px}
.oc-head .obk{margin-left:auto;color:var(--mu);font-size:11px}
.ol-line{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--ln)}
.ol-line:last-child{border-bottom:0}
.ol-name{flex:1;min-width:0;font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px}
.ol-tag{font:700 9px Impact,'Arial Narrow',sans-serif;letter-spacing:.05em;background:var(--grn);color:#052e16;border-radius:4px;padding:1px 6px;text-transform:uppercase}
.ol-pri{font:700 16px Impact,'Arial Narrow',sans-serif;font-variant-numeric:tabular-nums;color:var(--tx);min-width:56px;text-align:right}
.ol-line.fav .ol-pri{color:var(--grn)}
.ol-sub{min-width:56px;text-align:right;color:var(--mu);font-variant-numeric:tabular-nums;font-size:12px}
.odds-mk{margin:0}
.sortable td .fav{color:var(--grn);font-weight:700}
.sortable .sm{font-weight:400}
.err{background:#3a1212;border:1px solid #7a1f1f;border-radius:8px;padding:10px 12px;margin:8px 0}
pre{background:#0a0a0c;border:1px solid var(--ln);border-radius:6px;padding:10px;overflow:auto;max-height:340px;font-size:12px}
.dayhead{display:flex;align-items:center;gap:10px;margin:20px 0 9px;padding-left:10px;border-left:4px solid var(--acc2);flex-wrap:wrap}
.dayhead b{font-family:Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:17px;font-weight:400}
/* team cards */
.tcard{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer}.tcard:hover{border-color:var(--acc)}
.tcard .lg{width:40px;height:40px}.tcard .nm{font-weight:700}.tcard .rc{color:var(--mu);font-size:11px}
/* leader/player rows */
.prow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--ln)}.prow:hover{background:var(--p2)}
.prow .rk{width:26px;color:var(--mu);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.prow .hd{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:top;background:#1e1c24;flex:none}
.prow .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .tm{color:var(--mu);font-size:11px;width:60px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .val{font:700 16px Impact,'Arial Narrow',sans-serif;min-width:48px;text-align:right;color:var(--acc)}
/* modal */
.modal{position:fixed;inset:0;background:#000c;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.mb{background:var(--p);border:1px solid var(--ln);border-radius:12px;max-width:980px;width:100%;padding:18px;position:relative}
.x{position:absolute;right:12px;top:8px;background:none;border:0;color:#fff;font-size:26px;cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:var(--p2);color:var(--mu);border:1px solid var(--ln);border-radius:99px;padding:5px 14px;font:600 12px inherit;cursor:pointer;text-transform:uppercase;letter-spacing:.03em}.tabs button.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.bxteams{display:grid;grid-template-columns:1fr 1fr;gap:14px}.bxteam{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:10px}
.bxteam h4{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:14px}
.bxsum{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-bottom:8px}
.bxsum b{color:var(--tx)}
@media(max-width:700px){.bxteams{grid-template-columns:1fr}.oc-head .obk{margin-left:0;width:100%}}
/* full stats tables */
.sortable{width:100%;border-collapse:collapse}.sortable th{background:var(--p);color:var(--mu);font-size:11px;text-transform:uppercase;font-weight:600;padding:7px 8px;border-bottom:2px solid var(--ln);cursor:pointer;white-space:nowrap;text-align:left}.sortable th.n{text-align:right}
.sortable th:hover{color:#fff}.sortable th.on{color:var(--acc)}
.sortable td{padding:6px 8px;border-bottom:1px solid var(--ln);white-space:nowrap;font-variant-numeric:tabular-nums}
.sortable td.pname{font-weight:700}.sortable .tlogo{width:20px;height:20px;border-radius:50%;object-fit:contain;vertical-align:middle;margin-right:6px;background:#1e1c24}
/* team detail */
.thd{display:flex;align-items:center;gap:14px;margin-bottom:14px}.thd .lg{width:56px;height:56px}
.thd .tn{font-size:20px;font-weight:700}.thd .tsub{color:var(--mu);font-size:12px}
.trec{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:14px}
.trec .cell{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:8px 10px}
.trec .k{color:var(--mu);font-size:10px;text-transform:uppercase;letter-spacing:.04em;display:block}
.trec .v{font:700 18px Impact,'Arial Narrow',sans-serif;color:var(--tx)}
.leads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.lead{display:flex;align-items:center;gap:10px;background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:10px}
.lead .hd{width:34px;height:34px}.lead .lk{color:var(--mu);font-size:10px;text-transform:uppercase;display:block}
.lead .lv{font:700 18px Impact,'Arial Narrow',sans-serif;color:var(--acc)}.lead .ln{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:640px){.leads{grid-template-columns:1fr}}
/* matchup MMA bars */
.mm-select{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mm-sel{flex:1}.mm-sel select{width:100%}
.mm-vs{font-family:Impact,'Arial Narrow',sans-serif;color:var(--acc);font-size:22px;flex:none}
.mm-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.mm-team{flex:1;display:flex;align-items:center;gap:12px}
.mm-team img{width:48px;height:48px;object-fit:contain}
.mm-team.left{justify-content:flex-start}
.mm-team.right{justify-content:flex-end;text-align:right;flex-direction:row-reverse}
.mm-tn{font-weight:700;font-size:17px}
.mm-vsbig{font-family:Impact,'Arial Narrow',sans-serif;color:var(--mu);font-size:20px;flex:none}
.mm-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}
.mm-row:last-child{border-bottom:0}
.mm-side{flex:1;display:flex;align-items:center;gap:8px}
.mm-side.left{justify-content:flex-end}
.mm-side.right{justify-content:flex-start}
.mm-bar{flex:1;display:flex;height:18px;background:var(--p2);border-radius:5px;overflow:hidden}
.mm-side.left .mm-bar{justify-content:flex-end}
.mm-side.right .mm-bar{justify-content:flex-start}
.mm-fill{height:100%;border-radius:5px}
.mm-fill.a{background:var(--acc)}.mm-fill.b{background:var(--blu)}
.mm-label{width:130px;text-align:center;font-family:Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:14px;flex:none;color:var(--tx)}
.mm-pct{min-width:40px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.mm-side.left .mm-pct{text-align:right}.mm-side.right .mm-pct{text-align:left}
.mm-val{min-width:48px;font-size:11px;color:var(--mu);font-variant-numeric:tabular-nums}
.mm-side.left .mm-val{text-align:right}.mm-side.right .mm-val{text-align:left}
.mm-vs-head{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.mm-spread{font:700 12px "Segoe UI",system-ui,Arial,sans-serif;background:var(--p2);border:1px solid var(--ln);border-radius:6px;padding:3px 8px;white-space:nowrap;color:var(--tx);font-variant-numeric:tabular-nums}
.mm-total{font:700 12px "Segoe UI",system-ui,Arial,sans-serif;background:rgba(46,204,113,.12);border:1px solid rgba(46,204,113,.45);border-radius:6px;padding:3px 8px;white-space:nowrap;color:var(--grn);font-variant-numeric:tabular-nums}
.mm-vs-odds{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mm-vs-name{text-align:center;font-family:Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:15px;color:var(--tx)}
.mm-val.hi{background:rgba(255,105,180,.30);border-radius:4px;padding:1px 5px;color:#ffd7e8;font-weight:700}
</style></head><body>
<header><div class="hd"><div class="logo">NBA<b>HUB</b></div>
<nav id="nav"></nav><div class="chips" id="chips"></div></div></header>
<main id="view"><div class="loading">Loading…</div></main>
<div id="modal"></div>
<script>
"use strict";
if(location.protocol==='file:'){location.replace('http://localhost:8092/nba.html')}

const TABS=[['dash','Dashboard'],['stand','Standings'],['teams','Teams'],['results','Results'],['players','Players'],['leaders','Leaders'],['news','News'],['odds','Odds'],['admin','Admin']];
let TAB='dash';
const DATA={};

const $=s=>document.querySelector(s);
const api=async p=>{const r=await fetch(p);const j=await r.json().catch(()=>({}));return {data:j,stale:r.headers.get('X-Stale')==='1',cache:r.headers.get('X-Cache')};};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(name){return String(name||'').split(/\s+/).map(w=>w[0]||'').slice(0,3).join('').toUpperCase()}
function img(src,cls,alt){const a=esc(initials(alt));return src?`<img class="${cls}" src="${esc(src)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;av ${cls}&quot;>${a}</span>'">`:`<span class="av ${cls}">${a}</span>`}
function fmtDay(iso){try{const d=new Date(iso);return d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}catch{return iso}}
function fmtTime(iso){try{const d=new Date(iso);return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}catch{return ''}}

// ---------- Dashboard ----------
function gameCard(g){
  const st=g.status;
  const pill=st==='live'?'<span class="livepill">LIVE</span>':st==='final'?'<span class="pill">FINAL</span>':'<span class="pill">UPCOMING</span>';
  const clock=st==='live'&&g.clock?(' · Q'+g.period+' '+esc(g.clock)):(st==='live'&&g.period?(' · Q'+g.period):'');
  const detail=st==='scheduled'?fmtTime(g.date):(g.statusDetail||'');
  const row=(t)=>{const w=t&&t.winner?' win':'';return `<div class="grow${w}">${img(t&&t.logo,'lg',t&&t.name)}<span class="nm">${esc(t&&t.name||'')}</span><span class="rec">${esc(t&&t.record||'')}</span><span class="sc">${esc(t&&t.score!==''?t.score:'–')}</span></div>`};
  const ok=g.home&&g.home.abbr&&g.away&&g.away.abbr;
  const matchBtn=(st==='scheduled'&&ok)?`<button class="gbtn" onclick="toggleMatchup('${esc(g.id)}','${esc(g.home.abbr)}','${esc(g.away.abbr)}')">Match Up Metrics</button>`:'';
  const top5Btn=ok?`<button class="gbtn tp5" onclick="toggleTop5('${esc(g.id)}','${esc(g.home.abbr)}','${esc(g.home.name)}','${esc(g.away.abbr)}','${esc(g.away.name)}')">Top 5 Players</button>`:'';
  const actions=(matchBtn||top5Btn)?`<div class="gactions">${matchBtn}${top5Btn}</div>`:'';
  return `<div class="gcard" data-game="${esc(g.id)}"><div class="gtop">${pill}<span class="ev">${esc(detail)}${clock}</span></div>${row(g.home)}${row(g.away)}${g.venue?`<div class="gfoot"><span>📍 ${esc(g.venue)}</span></div>`:''}${actions}<div class="gdetail"></div></div>`;
}
async function renderDash(){
  const v=$('#view');v.innerHTML='<div class="loading">Loading scoreboard…</div>';
  const {data,stale}=await api('/api/scoreboard');
  if(data.error){v.innerHTML=`<div class="err">Scoreboard unavailable: ${esc(data.error||'')}</div>`;return}
  const live=data.live||[],up=data.upcoming||[],rec=(data.recent||[]).slice(0,30);
  const groups=[],byDay=new Map();
  for(const g of up){const k=fmtDay(g.date)||'Upcoming';if(!byDay.has(k))byDay.set(k,[]);byDay.get(k).push(g)}
  for(const [k,arr] of byDay)groups.push({label:k,games:arr});
  const html=[];
  if(live.length)html.push(`<div class="sec"><h2>Live now</h2><small>${live.length}${stale?' · stale':''}</small></div><div class="grid g2">${live.map(gameCard).join('')}</div>`);

let TEAM_ROSTER=[], RSORT={k:'pts',dir:-1};
const RCOLS=[['height','HT',0,0],['weight','WT',0,0],['age','AGE',0,1],['exp','EXP',0,1],['gp','GP',0,1],['min','MIN',1,1],['pts','PTS',1,1],['reb','REB',1,1],['ast','AST',1,1],['fgPct','FG%',1,1],['threePct','3P%',1,1],['tsPct','TS%',1,1]];
const rget=(p,key)=>key==='height'?p.height:(key==='weight'?p.weight:(key==='age'?p.age:(key==='exp'?p.exp:(p.stats&&p.stats[key]))));
const rcell=(p,key,dec)=>{const v=rget(p,key);if(v==null||v==='')return '–';const n=Number(v);return Number.isFinite(n)?(dec?n.toFixed(1):String(v)):esc(v)};
function rSort(k){if(RSORT.k===k){RSORT.dir=-RSORT.dir}else{RSORT.k=k;RSORT.dir=-1}drawRoster()}
function drawRoster(){
  const sorted=[...TEAM_ROSTER].sort((a,b)=>{
    const va=rget(a,RSORT.k),vb=rget(b,RSORT.k);
    const na=Number(va),nb=Number(vb);
    if(Number.isFinite(na)&&Number.isFinite(nb))return (na-nb)*RSORT.dir;
    return String(va==null?'':va).localeCompare(String(vb==null?'':vb))*RSORT.dir;
  });
  const head=`<th>Player</th>${RCOLS.map(([k,l,,sortable])=>sortable?`<th class="n${k===RSORT.k?' on':''}" onclick="rSort('${k}')">${l}${k===RSORT.k?(RSORT.dir<0?' ▾':' ▴'):''}</th>`:`<th class="n">${l}</th>`).join('')}`;

    const nameCell=`<td class="pname"><span class="mu sm">${esc(p.jersey||'')}</span> ${esc(p.name)} <span class="mu sm">${esc(p.position||'')}</span></td>`;
    const cells=RCOLS.map(([k,l,dec])=>`<td class="n">${rcell(p,k,dec)}</td>`).join('');
    return `<tr>${nameCell}${cells}</tr>`;
  }).join('');
  const el=document.getElementById('rtable');
  if(el)el.innerHTML=`<thead><tr>${head}</tr></thead><tbody>${rows||'<tr><td colspan="13" class="mu">No roster.</td></tr>'}</tbody>`;
}

// ---------- Matchup + Top-5 helpers (inline MMA comparison inside game cards) ----------
const PILLAR_KEYS=['stamina','sharpness','efficiency','speed','tempoGrip'];
const PILLAR_NAMES={stamina:'Stamina',sharpness:'Sharpness',efficiency:'Efficiency',speed:'Speed',tempoGrip:'Tempo Grip'};
let _pillars=null, _players=null, _odds=null;
async function getPillars(){if(_pillars)return _pillars;const {data}=await api('/api/pillars');_pillars=data.teams||[];return _pillars;}
async function getPlayers(){if(_players)return _players;const {data}=await api('/api/players');_players=data.players||[];return _players;}
async function getOdds(){if(_odds)return _odds;const {data}=await api('/api/odds');_odds=Array.isArray(data)?data:[];return _odds;}
function normName(n){return (n||'').replace(/^Los Angeles\b/,'LA').trim();}
function spreadFor(odds,homeName,awayName){
  const g=odds.find(x=>(normName(x.home_team)===normName(homeName)&&normName(x.away_team)===normName(awayName))||(normName(x.home_team)===normName(awayName)&&normName(x.away_team)===normName(homeName)));
  if(!g)return {h:null,a:null,total:null};
  const bk=(g.bookmakers||[])[0]||{};
  const sp=((bk.markets||[]).find(x=>x.key==='spreads')||{}).outcomes||[];
  const to=((bk.markets||[]).find(x=>x.key==='totals')||{}).outcomes||[];
  const h=sp.find(o=>normName(o.name)===normName(homeName))||null;
  const a=sp.find(o=>normName(o.name)===normName(awayName))||null;
  const ov=to.find(o=>o.name==='Over')||null;
  return {h,a,total:ov&&ov.point!=null?ov.point:null};
}
function spreadStr(o){if(!o||o.point==null)return null;const p=o.point>0?'+'+o.point:String(o.point);const px=o.price!=null?Number(o.price).toFixed(2):'';return p+'@'+px;}
function matchupBarsHTML(A,B,hSp,aSp,total){
  const hS=spreadStr(hSp), aS=spreadStr(aSp);
  const hChip=hS?`<span class="mm-spread">(H${esc(hS)})</span>`:'';
  const aChip=aS?`<span class="mm-spread">(A${esc(aS)})</span>`:'';
  const tChip=total!=null?`<span class="mm-total">TOTAL ${Number(total).toFixed(1)}</span>`:'';
  const bars=PILLAR_KEYS.map(k=>{
    const va=A?.[k], vb=B?.[k];
    let pa,pb;
    if(va==null&&vb==null){pa=50;pb=50;}
    else{const na=va==null?0:va, nb=vb==null?0:vb; const tot=na+nb; pa=tot>0?na/tot*100:50; pb=100-pa;}
    const la=va==null?'–':Number(va).toFixed(2);
    const lb=vb==null?'–':Number(vb).toFixed(2);
    const hiA=va!=null&&vb!=null&&va>vb, hiB=va!=null&&vb!=null&&vb>va;
    return `<div class="mm-row">
      <div class="mm-side left"><span class="mm-val${hiA?' hi':''}">${la}</span><div class="mm-bar"><div class="mm-fill a" style="width:${pa.toFixed(1)}%"></div></div><span class="mm-pct">${Math.round(pa)}%</span></div>
      <div class="mm-label">${PILLAR_NAMES[k]}</div>
      <div class="mm-side right"><span class="mm-pct">${Math.round(pb)}%</span><div class="mm-bar"><div class="mm-fill b" style="width:${pb.toFixed(1)}%"></div></div><span class="mm-val${hiB?' hi':''}">${lb}</span></div>
    </div>`;
  }).join('');
  return `<div class="mm-vs-head"><div class="mm-vs-name">${A?esc(A.name):''} <span class="mu">vs</span> ${B?esc(B.name):''}</div><div class="mm-vs-odds">${hChip}${tChip}${aChip}</div></div><div class="gdetail-inner">${bars}</div>`;
}
function top5HTML(players,ha,hn,aa,an){
  const n=v=>{const x=Number(v);return Number.isFinite(x)?x:0};
  const topFor=abbr=>players.filter(p=>(p.teamShortName||'').toUpperCase()===(abbr||'').toUpperCase())
    .map(p=>({...p,combo:(n(p.stats&&p.stats.tsPct)+n(p.stats&&p.stats.avgPoints))/1.3}))
    .sort((a,b)=>b.combo-a.combo).slice(0,5);
  const render=(abbr,name,mirror)=>{
    const top=topFor(abbr);
    const rows=top.map(p=>mirror
      ?`<div class="tp5-row mir"><div class="tp5-sc">${p.combo.toFixed(1)}</div><div class="tp5-info"><div class="tp5-nm">${esc(p.name||'')}</div></div>${img(p.headshot,'hs',p.name)}</div>`
      :`<div class="tp5-row">${img(p.headshot,'hs',p.name)}<div class="tp5-info"><div class="tp5-nm">${esc(p.name||'')}</div></div><div class="tp5-sc">${p.combo.toFixed(1)}</div></div>`
    ).join('');
    return `<div class="tp5-team${mirror?' mir':''}"><div class="tp5-h">${esc(name||abbr)}</div>${rows||'<div class="mu sm">No players yet</div>'}</div>`;
  };
  return `<div class="tp5-head">Top 5 Players</div><div class="tp5-grid">${render(ha,hn,false)}${render(aa,an,true)}</div>`;
}

// ---------- Results archive (final games + team-form trends) ----------
async function renderResults(){
  const v=$('#view');v.innerHTML='<div class="loading">Loading results…</div>';
  const {data}=await api('/api/results');
  if(data.error||!data.results||!data.results.length){v.innerHTML=`<div class="sec"><h2>Results Archive</h2></div><div class="card"><p class="mu">No archived results yet — games are auto-archived once they finish.</p></div>`;return}
  const results=[...data.results].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const form={};
  for(const r of results){
    const h=r.home,a=r.away;if(!h||!a)continue;
    if(!form[h.abbr])form[h.abbr]={abbr:h.abbr,name:h.name,w:0,l:0};
    if(!form[a.abbr])form[a.abbr]={abbr:a.abbr,name:a.name,w:0,l:0};
    if(h.winner){form[h.abbr].w++;form[a.abbr].l++}else if(a.winner){form[a.abbr].w++;form[h.abbr].l++}
  }
  const formList=Object.values(form).sort((a,b)=>{const pa=a.w/(a.w+a.l||1),pb=b.w/(b.w+b.l||1);return pb-pa||(b.w-a.w)});
  const formCards=formList.map(t=>{
    const gp=t.w+t.l,pct=gp?Math.round(t.w/gp*100):0;
    return `<div class="form-card"><div class="form-nm">${esc(t.abbr)}</div><div class="form-wl">${t.w}<span class="mu">–${t.l}</span></div><div class="form-pct ${pct>=60?'good':pct<=40?'bad':''}">${pct}%</div></div>`;
  }).join('');
  const rows=results.map(r=>{
    const h=r.home,a=r.away;
    const d=r.date?new Date(r.date).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
    return `<tr><td class="n mu">${d}</td><td class="${h&&h.winner?'win':''}">${h?esc(h.name):''}</td><td class="n b">${h&&h.score!==''?h.score:'–'} – ${a&&a.score!==''?a.score:'–'}</td><td class="${a&&a.winner?'win':''}">${a?esc(a.name):''}</td></tr>`;
  }).join('');
  v.innerHTML=`<div class="sec"><h2>Results Archive</h2><small>${results.length} final games · auto-archived for trend analysis</small></div>
    <div class="sec"><h2>Team Form</h2><small>W–L from archived results</small></div><div class="form-grid">${formCards}</div>
    <div class="sec"><h2>Games</h2></div>
    <div class="stbl"><table class="sortable"><thead><tr><th class="n">Date</th><th>Home</th><th class="n">Score</th><th>Away</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ---------- News ----------
async function renderNews(){
  const v=$('#view');v.innerHTML='<div class="loading">Loading news…</div>';
  const {data,stale}=await api('/api/news');
  const arts=(data&&data.articles)||[];
  const rows=arts.map(a=>{const im=(a.images&&a.images[0]&&a.images[0].url)||'';const dt=a.published?new Date(a.published).toLocaleString():'';const body=(a.description||a.headline||'').slice(0,180);const href=(a.links&&(a.links.web?a.links.web.href:a.links.href))||'#';
    return `<a class="news" href="${esc(href)}" target="_blank" rel="noreferrer">${im?`<img src="${esc(im)}" loading="lazy" onerror="this.style.display='none'">`:''}<div><div class="tt">${esc(a.headline||'')}</div>${body?`<div class="mu sm">${esc(body)}</div>`:''}<div class="ds">${esc(dt)}</div></div></a>`;}).join('');
  v.innerHTML=`<div class="sec"><h2>NBA News</h2><small>${arts.length} stories${stale?' · stale':''}</small></div>${rows||'<div class="loading">No news.</div>'}`;
}

// ---------- Odds ----------
let OD={games:[],bk:'fanduel',stale:false,bks:[],sort:'',dir:1};
async function renderOdds(){
  const v=$('#view');v.innerHTML='<div class="loading">Loading odds…</div>';
  const {data,stale}=await api('/api/odds');
  OD.games=Array.isArray(data)?data:[];
  OD.stale=stale;
  const seen={};OD.games.forEach(g=>(g.bookmakers||[]).forEach(b=>{if(!seen[b.key])seen[b.key]=b.title}));
  OD.bks=Object.keys(seen).map(k=>({key:k,title:seen[k]}));
  if(!OD.bks.some(b=>b.key===OD.bk))OD.bk=OD.bks.length?OD.bks[0].key:'';
  drawOdds(v);
}
function oddsRow(g){
  const bk=(g.bookmakers||[]).find(b=>b.key===OD.bk)||(g.bookmakers&&g.bookmakers[0])||{};
  const out=m=>((bk.markets||[]).find(x=>x.key===m)||{}).outcomes||[];
  const h2h=out('h2h'),sp=out('spreads'),to=out('totals');
  const fn=(arr,n)=>arr.find(o=>o.name===n)||null;
  const aM=fn(h2h,g.away_team),hM=fn(h2h,g.home_team);
  const aS=fn(sp,g.away_team),hS=fn(sp,g.home_team);
  const ov=fn(to,'Over'),un=fn(to,'Under');
  const px=o=>o&&o.price!=null?o.price:null,pt=o=>o&&o.point!=null?o.point:null;
  return {away:g.away_team,home:g.home_team,
    aM:px(aM),hM:px(hM),aPt:pt(aS),aPx:px(aS),hPt:pt(hS),hPx:px(hS),
    tot:pt(ov),ov:px(ov),un:px(un),bk:bk.title||'',t:g.commence_time||''};
}
function drawOdds(v){
  const bksel=OD.bks.map(b=>`<option value="${esc(b.key)}"${b.key===OD.bk?' selected':''}>${esc(b.title)}</option>`).join('');
  const rows=OD.games.map(oddsRow);
  if(OD.sort){rows.sort((a,b)=>{let x=a[OD.sort],y=b[OD.sort];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;if(typeof x==='number')return (x-y)*OD.dir;return String(x).localeCompare(String(y))*OD.dir;});}
  const th=(k,l,n)=>`<th data-k="${k}" class="${n?'n':''}${OD.sort===k?' on':''}">${l}${OD.sort===k?(OD.dir>0?' ▲':' ▼'):''}</th>`;
  const ml=p=>p!=null?p.toFixed(2):'<span class="mu">–</span>';
  const spread=(pt,px)=>{if(pt==null)return '<span class="mu">–</span>';return `<span class="${pt<0?'fav':''}">${(pt>0?'+':'')+pt}</span>${px!=null?`<span class="mu sm"> @ ${px.toFixed(2)}</span>`:''}`;};
  const trs=rows.map(r=>`<tr>
    <td class="pname">${esc(r.away)}</td><td class="pname">${esc(r.home)}</td>
    <td class="n">${ml(r.aM)}</td><td class="n">${ml(r.hM)}</td>
    <td class="n">${spread(r.aPt,r.aPx)}</td><td class="n">${spread(r.hPt,r.hPx)}</td>
    <td class="n">${r.tot!=null?r.tot:'<span class="mu">–</span>'}</td>
    <td class="n">${ml(r.ov)}</td><td class="n">${ml(r.un)}</td>
  </tr>`).join('');
  const cur=OD.bks.find(b=>b.key===OD.bk);
  v.innerHTML=`<div class="sec"><h2>NBA Odds</h2><small>${rows.length} games · ${esc(cur?cur.title:'')}${OD.stale?' · stale':''}</small></div>
    <div class="bar"><select id="odbk">${bksel}</select><button class="b" id="odcsv">Export CSV</button><span class="mu sm">negative spread = favourite giving the handicap · click a column to sort</span></div>
    <div class="stbl"><table class="sortable" id="odtable"><thead><tr>
      ${th('away','Away')}${th('home','Home')}${th('aM','Away ML',1)}${th('hM','Home ML',1)}${th('aPt','Away Spread',1)}${th('hPt','Home Spread',1)}${th('tot','Total',1)}${th('ov','Over',1)}${th('un','Under',1)}
    </tr></thead><tbody>${trs||'<tr><td colspan="9" class="mu">No odds available.</td></tr>'}</tbody></table></div>`;
  $('#odbk').addEventListener('change',e=>{OD.bk=e.target.value;drawOdds(v)});
  v.querySelectorAll('#odtable th').forEach(h=>h.addEventListener('click',()=>{const k=h.dataset.k;if(OD.sort===k)OD.dir*=-1;else{OD.sort=k;OD.dir=1}drawOdds(v)}));
  const cb=$('#odcsv');if(cb)cb.addEventListener('click',()=>exportOddsCsv(rows));
}
function exportOddsCsv(rows){
  const head=['Away','Home','AwayML','HomeML','AwaySpread','HomeSpread','Total','Over','Under'];
  const line=r=>[r.away,r.home,r.aM,r.hM,r.aPt,r.hPt,r.tot,r.ov,r.un].map(x=>x==null?'':x).join(',');
  const csv=[head.join(','),...rows.map(line)].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='nba_odds.csv';a.click();
}

// ---------- Admin ----------
async function renderAdmin(){
  const v=$('#view');v.innerHTML='<div class="loading">Loading health…</div>';
  const h=await api('/api/health');
  const st=h.data.staging||[];
  const rows=st.map(r=>`<tr><td>${esc(r.source)}</td><td>${esc(r.key)}</td><td class="mu sm">${esc(r.fetched_at)}</td></tr>`).join('');
  v.innerHTML=`<div class="sec"><h2>Admin · Staging snapshot</h2></div>
    <div class="grid g2">
      <div class="card"><h3>Cache & staging</h3><p class="mu sm">In-memory TTL cache + SQLite staging table (nba_staging.db). Every successful fetch is mirrored here; on upstream failure the site serves this snapshot with <b>zero</b> upstream requests.</p>
        <table><tbody><tr><td>Staging rows</td><td class="n"><b>${h.data.staging_rows}</b></td></tr><tr><td>Stale (from snapshot)</td><td class="n">${st.some(r=>r.fetched_at)?'<span class="ok">ready</span>':'<span class="warn">warming…</span>'}</td></tr></tbody></table>
      </div>
      <div class="card"><h3>Snapshot contents</h3><div style="max-height:340px;overflow:auto"><table><thead><tr><th>Source</th><th>Key</th><th>Fetched</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="mu">Empty — hit a tab first.</td></tr>'}</tbody></table></div>
        <div class="bar" style="margin-top:12px"><button class="b r" onclick="location.reload()">Reload</button></div>
      </div>
    </div>`;
}

function nav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k===TAB?'on':''}">${l}</button>`).join('')}
function go(t){TAB=t;nav();render()}
function render(){({dash:renderDash,stand:renderStand,teams:renderTeams,results:renderResults,players:renderPlayers,leaders:renderLeaders,news:renderNews,odds:renderOdds,admin:renderAdmin}[TAB]||renderDash)();}

document.addEventListener('click',e=>{
  const nb=e.target.closest('#nav button');if(nb){go(nb.dataset.t);return}
  const tc=e.target.closest('.tcard');if(tc){openTeam(tc.dataset.team);return}
});

nav();render();
</script>
